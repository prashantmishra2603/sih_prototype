<!doctype html>
<html lang="en" data-theme="cream">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BidCheck AI — GeM & Statutory Procurement Intelligence</title>
    <script>
      (function() {
        var active = sessionStorage.getItem('bidcheck_theme_active');
        if (active === 'dark') {
          document.documentElement.removeAttribute('data-theme');
        } else {
          document.documentElement.setAttribute('data-theme', 'cream');
          sessionStorage.setItem('bidcheck_theme_active', 'cream');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
